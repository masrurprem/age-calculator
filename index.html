<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=`, initial-scale=1.0" />
    <title>Age Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- the html guys -->
    <div class="container">
      <h1 class="header--1">Age Calculator</h1>
      <h3 class="header--2">Your Age We Calculate</h3>
      <p class="intro--para">Enter Your Birth Date</p>
      <form class="form--div" id="form">
        <div class="form--fields">
          <div class="input--date"><input type="date" class="birthday" /></div>
          <div>
            <button class="btn--submit" id="submit">Calculate Age</button>
          </div>
        </div>
      </form>
      <div class="disp--age">
        <p id="txt--result">Your Age is <span id="result">0</span> Years Old</p>
      </div>
    </div>

    <!-- js -->
    <script src="script.js"></script>
  </body>
</html>
